<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-title="login.title">Blogness</title>
<meta name="description" content="Blogness: a slower social space for lifestyle, travel and design lovers.">
<meta name="theme-color" content="#F6F8FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/social.css">
</head>
<body>
<div class="app">
  <header class="login-hero">
    <div class="langs" role="group" data-i18n-aria="login.langLabel" id="langs">
      <button type="button" data-lang="it">IT</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="es">ES</button>
    </div>
    <div>
      <span class="eyebrow" data-i18n="login.eyebrow"></span>
      <h1 class="brand">Blogness</h1>
      <p class="tagline" data-i18n="login.tagline"></p>
    </div>
  </header>

  <div class="login-body">
    <div class="utabs" role="group" data-i18n-aria="login.groupLabel" id="modeTabs">
      <button type="button" data-mode="login" aria-pressed="true" data-i18n="login.tabLogin"></button>
      <button type="button" data-mode="signup" aria-pressed="false" data-i18n="login.tabSignup"></button>
    </div>

    <div class="social" id="social">
      <button type="button" class="btn block social-btn" data-provider="google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.9l-8 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
        <span id="googleLabel"></span>
      </button>
      <button type="button" class="btn block social-btn" data-provider="facebook">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v2.9h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/><path fill="#FFFFFF" d="M16.7 15.5l.5-3.5h-3.4V9.7c0-1 .5-1.9 2-1.9h1.5V4.9s-1.4-.2-2.7-.2c-2.7 0-4.5 1.6-4.5 4.7V12h-3v3.5h3v8.4a12 12 0 0 0 3.8 0v-8.4z"/></svg>
        <span id="facebookLabel"></span>
      </button>
      <p class="err" role="alert" id="socialErr"></p>
      <div class="or"><span id="orLabel"></span></div>
    </div>

    <form class="auth" id="loginForm" novalidate>
      <div class="field"><label for="li-email" data-i18n="login.email"></label><input id="li-email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="li-pass" data-i18n="login.password"></label><input id="li-pass" name="password" type="password" autocomplete="current-password" required></div>
      <button type="button" class="link-btn" id="toForgot" style="align-self:flex-end;margin-top:-14px" data-i18n="login.forgot"></button>
      <p class="err" role="alert"></p>
      <button class="btn primary block" type="submit" data-i18n="login.enter"></button>
    </form>

    <form class="auth" id="signupForm" hidden novalidate>
      <div class="field-row">
        <div class="field"><label for="su-first" data-i18n="login.first"></label><input id="su-first" name="firstName" autocomplete="given-name" required></div>
        <div class="field"><label for="su-last" data-i18n="login.last"></label><input id="su-last" name="lastName" autocomplete="family-name"></div>
      </div>
      <div class="field"><label for="su-email" data-i18n="login.email"></label><input id="su-email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="su-pass" data-i18n="login.password"></label><input id="su-pass" name="password" type="password" autocomplete="new-password" minlength="6" required></div>
      <p class="err" role="alert"></p>
      <button class="btn primary block" type="submit" data-i18n="login.create"></button>
    </form>

    <form class="auth" id="forgotForm" hidden novalidate>
      <p class="lead" data-i18n="login.forgotText"></p>
      <div class="field"><label for="fg-email" data-i18n="login.email"></label><input id="fg-email" name="email" type="email" autocomplete="email" required></div>
      <p class="err" role="alert"></p>
      <p class="ok-note" role="status"></p>
      <button class="btn primary block" type="submit" data-i18n="login.sendLink"></button>
      <button type="button" class="link-btn" data-back style="align-self:center" data-i18n="login.backToLogin"></button>
    </form>

    <form class="auth" id="verifyForm" hidden novalidate>
      <p class="lead" data-i18n="login.verifyText"></p>
      <div class="field"><label for="vf-code" data-i18n="login.code"></label><input id="vf-code" name="code" inputmode="numeric" autocomplete="one-time-code" required></div>
      <p class="err" role="alert"></p>
      <button class="btn primary block" type="submit" data-i18n="login.confirm"></button>
    </form>

    <div class="notice" id="approval" hidden data-i18n="login.approval"></div>

    <p class="muted" style="text-align:center;line-height:1.55"><span data-i18n="login.credNote"></span><br><span data-i18n="login.footer"></span></p>
  </div>
</div>
<script type="module" src="/js/app/login.js"></script>
</body>
</html>
