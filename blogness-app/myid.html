<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-title="nav.myid">Blogness</title>
<meta name="theme-color" content="#F6F8FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row ag-head">
      <a href="/myid.html" class="ag-me" id="meLink"><span class="ag-ph" id="mePh"></span><span><span class="ag-kick" id="agKick"></span><b class="ag-title">MyID</b></span></a>
      <span style="display:flex;gap:6px">
        <a class="ag-plus" href="/proposte.html?tab=day" id="addBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
      </span>
    </div>
  </header>
  <section id="agenda"></section>
  <section id="sub" hidden>
    <button type="button" class="ag-back" id="backBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span id="backLbl"></span></button>
    <h1 class="ag-subtitle" id="subTitle"></h1>
    <div id="profileBox" hidden>
      <section class="pf" id="pf"><div class="skeleton" style="height:92px;flex:1"></div></section>
      <section class="pf-bio" id="bio"></section>
      <div class="pf-btns">
        <a class="btn" href="https://www.blogness.org/my-id" target="_blank" rel="noopener" data-i18n="me.edit"></a>
        <button type="button" class="btn" id="shareBtn"></button>
      </div>
      <div class="sheet-menu" id="menu">
        <a class="btn quiet block" href="https://www.blogness.org/my-id" target="_blank" rel="noopener" data-i18n="me.completeCta"></a>
        <div class="lang-row">
          <label for="lang" style="font-size:14px" data-i18n="me.lang"></label>
          <select id="lang">
            <option value="auto" data-i18n="me.langAuto"></option>
            <option value="it">Italiano</option>
            <option value="en">English</option>
            <option value="es">Español</option>
          </select>
        </div>
        <button type="button" class="btn block" id="logout" data-i18n="me.logout"></button>
      </div>
    </div>
    <div id="list"></div>
  </section>
  <div style="height:110px"></div>
</div>
<nav class="tabs" id="tabs" aria-label="Menu"></nav>
<script type="module" src="/js/app/myid.js"></script>
</body>
</html>
