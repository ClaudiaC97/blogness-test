<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Music&amp;GO Blogness</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#26323D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fahkwang:wght@400;500;600;700&family=Raleway:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: mappa a tutto schermo + foglio inferiore trascinabile (mobile) / pannello destro (desktop) */
:root{
  --bg:#F2F0F7; --sea:#E7E4F0; --land:#D2CDE0; --line:#F7F6FB; --ink:#1B1730; --muted:#686283;
  --surface:#FFFFFF; --surface-2:#F6F4FA; --border:#E2DEEC;
  --accent:#D3336B; --accent-ink:#FFFFFF; --accent-2:#E8941F; --glow:rgba(211,51,107,.18);
  --font-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:18px; --shadow:0 10px 40px rgba(27,23,48,.14);
  --top-h:112px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#100E1A; --sea:#141124; --land:#2A2641; --line:#100E1A; --ink:#EFEBF8; --muted:#9F98B9;
  --surface:#1B182C; --surface-2:#231F37; --border:#2F2A47;
  --accent:#FF5C8E; --accent-ink:#1A0610; --accent-2:#FFB347; --glow:rgba(255,92,142,.22);
  --shadow:0 10px 40px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#100E1A; --sea:#141124; --land:#2A2641; --line:#100E1A; --ink:#EFEBF8; --muted:#9F98B9;
  --surface:#1B182C; --surface-2:#231F37; --border:#2F2A47;
  --accent:#FF5C8E; --accent-ink:#1A0610; --accent-2:#FFB347; --glow:rgba(255,92,142,.22);
  --shadow:0 10px 40px rgba(0,0,0,.45); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{position:fixed;inset:0;overflow:hidden}

/* ——— Mappa */
.stage{position:absolute;inset:0}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.sphere{fill:var(--sea)}
.grat{fill:none;stroke:var(--land);stroke-opacity:.35;stroke-width:.6;vector-effect:non-scaling-stroke}
.c{fill:var(--land);stroke:var(--line);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .25s}
.c.has{fill:color-mix(in oklab,var(--accent) 52%,var(--land));cursor:pointer}
.c.has.off{fill:color-mix(in oklab,var(--accent) 14%,var(--land))}
.c.has:hover{fill:color-mix(in oklab,var(--accent) 75%,var(--land))}
.c.sel,.c.sel:hover{fill:var(--accent-2)}
.mk{cursor:pointer}
.mk circle.dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.mk circle.pulse{fill:var(--accent);opacity:.35;transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
.mk text{font:600 8px var(--font-mono);fill:var(--accent-ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk.off{opacity:.25}.mk.off .pulse{display:none}
.mk.sel circle.dot{fill:var(--accent-2)}
@keyframes pulse{0%{transform:scale(1);opacity:.4}80%,100%{transform:scale(2.4);opacity:0}}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);box-shadow:var(--shadow);padding:6px 10px;border-radius:10px;font-size:13px;white-space:nowrap;z-index:5}
.tip b{font-weight:600}.tip span{color:var(--muted);font-family:var(--font-mono);font-size:11px;margin-left:6px}

/* ——— Barra superiore */
.top{position:absolute;top:0;left:0;right:0;z-index:20;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:8px;background:linear-gradient(var(--bg) 55%,color-mix(in srgb,var(--bg) 0%,transparent));pointer-events:none}
.top>*{pointer-events:auto}
.top-row{display:flex;align-items:center;gap:12px}
.brand{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;color:var(--accent)}
.brand svg{width:26px;height:26px;flex:none}
.lang{flex:none;height:42px;min-width:44px;padding:0 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font:600 12px var(--font-mono);letter-spacing:.06em}
.search-pill{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.04);text-align:left}
.search-pill svg{flex:none;width:18px;height:18px}
.search-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:0 max(16px,env(safe-area-inset-left,0px)) 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ——— Pulsanti mappa */
.fabs{position:absolute;z-index:15;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + var(--top-h) + 8px);display:flex;flex-direction:column;gap:8px}
.fab{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;box-shadow:var(--shadow)}
.fab svg{width:20px;height:20px}
.fab.go{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* ——— Foglio / pannello */
.sheet{position:absolute;z-index:30;left:0;right:0;bottom:0;height:var(--sheet-h,46%);background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.16);display:flex;flex-direction:column;transition:height .38s cubic-bezier(.2,.8,.2,1);will-change:height}
.sheet.dragging{transition:none}
.grab{flex:none;height:26px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab span{width:40px;height:5px;border-radius:5px;background:var(--border)}
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px;-webkit-overflow-scrolling:touch}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);background:var(--surface)}
.tab{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.tab svg{width:22px;height:22px}
.tab[aria-current="true"]{color:var(--accent)}

@media (min-width:900px){
  .top{right:420px}
  .stage{right:420px}
  .fabs{right:calc(420px + 20px)}
  .sheet{left:auto;top:0;width:420px;height:auto!important;border-radius:0;border-left:1px solid var(--border);box-shadow:none;padding-top:env(safe-area-inset-top,0px)}
  .grab{display:none}
  .tabs{order:-1;border-top:0;border-bottom:1px solid var(--border);padding-bottom:0}
  .tab{flex-direction:row;gap:6px;font-size:12.5px;height:56px;min-width:0;padding:0 4px}
  .tab svg{width:18px;height:18px;flex:none}
  .tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .body{padding-top:8px}
  .chips{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:48px}
  .sheet{box-shadow:-14px 0 34px -18px rgba(0,0,0,.22)}
}

@media (min-width:900px) and (max-width:1199px){
  .top{right:360px}
  .stage{right:360px}
  .fabs{right:calc(360px + 16px)}
  .sheet{width:360px}
}

/* ——— Contenuti */
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--font-display);font-weight:700;font-size:clamp(24px,6vw,30px);line-height:1.1;letter-spacing:-.02em;text-wrap:balance;margin:4px 0 0}
.h2{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:-.01em;margin:0}
.lead{color:var(--muted);margin:10px 0 0;max-width:62ch}
.stack{display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.count{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.backbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px;background:var(--surface)}
.back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;max-width:70%}
.back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back svg{width:18px;height:18px;flex:none}
.icon-btn{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}
.icon-btn[aria-pressed="true"]{color:var(--accent)}
.icon-btn[aria-pressed="true"] svg path{fill:currentColor}

/* vinile */
.vinyl{--h:330;flex:none;width:var(--s,52px);height:var(--s,52px);border-radius:50%;position:relative;
  background:
   radial-gradient(circle at 50% 50%,var(--surface) 0 6%,transparent 6.5%),
   radial-gradient(circle at 50% 50%,hsl(var(--h) 75% 58%) 0 30%,transparent 30.5%),
   repeating-radial-gradient(circle at 50% 50%,#17131f 0 2px,#262033 2.5px 3.5px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.18)}
.vinyl::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(130deg,rgba(255,255,255,.18),transparent 40%,transparent 60%,rgba(255,255,255,.08))}
.vinyl b{position:absolute;inset:0;display:grid;place-items:center;font:800 calc(var(--s,52px)*.19) var(--font-display);color:#fff;letter-spacing:-.02em;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.card-list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:14px;padding:10px;margin:0 -10px;border-radius:14px;text-align:left;width:calc(100% + 20px);transition:background .15s}
.row:hover,.row:active{background:var(--surface-2)}
.row .txt{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{width:18px;height:18px;color:var(--muted);flex:none}

.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--glow);color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px;align-items:center}
.meta .mono{font-family:var(--font-mono);font-size:12px}

.hero{display:flex;gap:18px;align-items:center}
.hero .vinyl{--s:112px}
.hero .txt{min-width:0}
.bio{margin:0;max-width:62ch}

.tracks{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.track{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:12px 12px 12px 14px}
.track+.track{border-top:1px solid var(--border)}
.track .n{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.track .tt{min-width:0}
.track .tt b{display:block;font-weight:600;overflow-wrap:anywhere}
.track .tt span{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.listen{display:flex;gap:6px}
.listen a{height:32px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;text-decoration:none;background:var(--surface-2)}
.listen a.yt{background:var(--accent);color:var(--accent-ink)}
.listen svg{width:14px;height:14px}

.facts{display:flex;flex-direction:column;gap:10px;counter-reset:f}
.fact{position:relative;padding:14px 14px 14px 52px;background:var(--surface-2);border-radius:var(--r);counter-increment:f}
.fact::before{content:counter(f);position:absolute;left:14px;top:13px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent-2);color:#1b1206;font:600 12px var(--font-mono)}

.linkcard{display:flex;gap:12px;align-items:center;padding:12px;border:1px dashed var(--border);border-radius:var(--r);text-align:left;width:100%}
.linkcard:hover{border-color:var(--accent)}
.linkcard .txt{min-width:0;flex:1}
.linkcard .t{font-weight:600}
.linkcard .s{font-size:13px;color:var(--muted)}

.feature{display:flex;gap:16px;align-items:center;padding:16px;border-radius:22px;text-align:left;width:100%;color:#fff;background:
  radial-gradient(120% 140% at 0% 0%,hsl(var(--h) 70% 48%),transparent 60%),
  linear-gradient(135deg,#1e1830,#2c1f3f)}
.feature .vinyl{--s:84px}
.feature .eyebrow{color:rgba(255,255,255,.7)}
.feature .t{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.15;margin-top:4px}
.feature .s{font-size:13px;opacity:.8;margin-top:4px}
.stats{display:flex;gap:10px}
.stat{flex:1;padding:12px;border-radius:16px;background:var(--surface-2)}
.stat b{display:block;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.region{padding:12px;border-radius:16px;border:1px solid var(--border);text-align:left}
.region b{display:block;font-weight:600}
.region span{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:600;width:100%}
.cta svg{width:18px;height:18px}
.empty{padding:28px 18px;text-align:center;border:1px dashed var(--border);border-radius:var(--r);color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.peek-hint{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}

/* ——— Quiz */
.qbar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qscore{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.qscore b{color:var(--accent-2)}
.prompt{padding:16px;border-radius:20px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.prompt .q{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.25;text-wrap:balance}
.prompt .clue{font-size:15px}
.prompt .clue b{font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{min-height:52px;padding:10px 12px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);font-weight:600;text-align:left;line-height:1.25;transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.98)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{background:color-mix(in oklab,#2fb67a 18%,var(--surface));border-color:#2fb67a}
.opt.ko{background:color-mix(in oklab,var(--accent) 14%,var(--surface));border-color:var(--accent)}
.opt.dim{opacity:.45}
.verdict{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;border:1px solid var(--border)}
.verdict .txt{flex:1;min-width:0}
.verdict .t{font-weight:700}
.verdict .s{font-size:13px;color:var(--muted)}
.btn-row{display:flex;gap:8px}
.btn-row>*{flex:1}
.ghost{display:flex;align-items:center;justify-content:center;height:48px;border-radius:16px;background:var(--surface-2);font-weight:600}
.final{text-align:center;padding:10px 0 4px}
.final .big{font-family:var(--font-display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.final .big span{color:var(--muted);font-size:28px}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;border:1px solid var(--border);text-align:left;width:100%}
.mode:hover{border-color:var(--accent)}
.mode .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--glow);color:var(--accent);flex:none}
.mode .ic svg{width:22px;height:22px}
.mode .t{font-weight:700}.mode .s{font-size:13px;color:var(--muted)}

/* ——— Ricerca */
.search{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.search-bar{display:flex;gap:10px;align-items:center;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--border)}
.search-bar input{flex:1;min-width:0;height:46px;border-radius:14px;border:1px solid var(--border);background:var(--surface);padding:0 14px;font:inherit;font-size:16px;color:var(--ink)}
.search-bar input:focus{outline:2px solid var(--accent);outline-offset:0}
.search-bar button{font-weight:600;color:var(--accent);padding:8px 4px}
.results{flex:1;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(24px + env(safe-area-inset-bottom,0px))}
.results .sec{margin-bottom:22px}
mark{background:var(--glow);color:inherit;border-radius:3px;padding:0 1px}

.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}}
.fade-in{animation:fade .28s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
<style id="theme-blogness">
/* Tema "Blogness": palette blu-ardesia e grigio di blogness.org (Wix color_11..20), font Fahkwang + Raleway */
:root{
  --bg:#F4F4F4; --sea:#E7ECF0; --land:#CBD3DA; --line:#F7F9FA; --ink:#26323D; --muted:#5E7080;
  --surface:#FFFFFF; --surface-2:#EEF2F5; --border:#DCE3E9;
  --accent:#526576; --accent-ink:#FFFFFF; --accent-2:#26323D; --glow:rgba(82,101,118,.14);
  --font-display:"Fahkwang",Georgia,"Times New Roman",serif;
  --font-body:"Raleway",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 10px 40px rgba(38,50,61,.14);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141A20; --sea:#18202A; --land:#2E3B47; --line:#141A20; --ink:#E7ECF0; --muted:#9AA9B6;
  --surface:#1C252E; --surface-2:#24303B; --border:#2F3D4A;
  --accent:#B7C3CD; --accent-ink:#141A20; --accent-2:#E7ECF0; --glow:rgba(183,195,205,.16);
  --shadow:0 10px 40px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141A20; --sea:#18202A; --land:#2E3B47; --line:#141A20; --ink:#E7ECF0; --muted:#9AA9B6;
  --surface:#1C252E; --surface-2:#24303B; --border:#2F3D4A;
  --accent:#B7C3CD; --accent-ink:#141A20; --accent-2:#E7ECF0; --glow:rgba(183,195,205,.16);
  --shadow:0 10px 40px rgba(0,0,0,.45); color-scheme:dark }

/* paesi con artisti: azzurro ardesia; selezionato: blu profondo */
.c.has{fill:color-mix(in oklab,var(--accent) 45%,var(--land))}
.c.has.off{fill:color-mix(in oklab,var(--accent) 12%,var(--land))}
.c.has:hover{fill:color-mix(in oklab,var(--accent) 75%,var(--land))}
.c.sel,.c.sel:hover{fill:var(--accent-2)}
.mk.sel circle.dot{fill:var(--accent-2)}

/* titoli: Fahkwang come sul sito, peso più leggero */
.brand{font-weight:700;letter-spacing:0}
.h1{font-weight:600;letter-spacing:-.005em}
.h2{font-weight:600;letter-spacing:0}
.feature .t,.final .big,.stat b{font-weight:600}
.by{font:500 10px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:2px;align-self:flex-end;padding-bottom:3px}

/* etichette dei vinili e scheda in evidenza nei toni blu-grigio */
.vinyl{background:
   radial-gradient(circle at 50% 50%,var(--surface) 0 6%,transparent 6.5%),
   radial-gradient(circle at 50% 50%,hsl(calc(198 + var(--h) / 20) 24% calc(38% + var(--h) * .09%)) 0 30%,transparent 30.5%),
   repeating-radial-gradient(circle at 50% 50%,#1A2128 0 2px,#27313B 2.5px 3.5px)}
.feature{background:
  radial-gradient(120% 140% at 0% 0%,#526576,transparent 60%),
  linear-gradient(135deg,#26323D,#3E4E5C)}
.fact::before{color:var(--surface);background:var(--accent)}
.listen a.yt,.cta{border-radius:999px}
.cta{background:var(--accent-2);color:var(--surface)}
.opt.ok{background:color-mix(in oklab,#3E8E6E 16%,var(--surface));border-color:#3E8E6E}
.opt.ko{background:color-mix(in oklab,#B5555E 12%,var(--surface));border-color:#B5555E}
.fab.go{background:var(--accent-2);color:var(--surface)}
@media (max-width:520px){ .by{display:none} }
</style>

const EN_DATA = {"artists":{"mina":{"origin":"Busto Arsizio","years":"1958 – present","bio":"Mina Anna Mazzini is the most admired voice in Italian music: extraordinary range and control, put to work on a repertoire that runs from singer-songwriter classics to jazz. She hasn't performed in public since 1978, but she keeps releasing records.","songs":[["Il cielo in una stanza","1960"],["Se telefonando","1966"],["Grande grande grande","1971"],["Parole parole","1972"]],"facts":["Her last public concert was in 1978, at La Bussola in Marina di Pietrasanta.","She's nicknamed 'the Tiger of Cremona', the city where she grew up.","She has lived in Lugano, Switzerland, for many years."],"links":["Her hit version of 'La canzone di Marinella' (1967) made De André famous"]},"lucio-dalla":{"origin":"Bologna","years":"1943 – 2012","bio":"Singer-songwriter, multi-instrumentalist and a symbol of Bologna. Starting out in jazz, he built a style all his own, made of everyday poetry, irony and big melodies.","songs":[["4/3/1943","1971"],["L'anno che verrà","1979"],["Futura","1980"],["Caruso","1986"]],"facts":["He started out as a clarinettist in Bologna jazz bands.","'Caruso' was born in Sorrento, in the hotel where the tenor had stayed.","'4/3/1943' was meant to be called 'Gesù bambino': the title was changed because of censorship."],"links":[]},"de-andre":{"origin":"Genoa","years":"1940 – 1999","bio":"'Faber' gave a voice to outcasts with lyrics of rare literary quality. With 'Crêuza de mä' he brought the Genoese dialect and the sounds of the Mediterranean to the heart of singer-songwriter music.","songs":[["La canzone di Marinella","1964"],["Bocca di Rosa","1967"],["Il pescatore","1970"],["Crêuza de mä","1984"]],"facts":["Many of his songs are studied in schools as poetry.","The album 'Crêuza de mä' is sung entirely in Genoese.","The nickname 'Faber' was given to him by his friend Paolo Villaggio."],"links":["Mina's version of 'Marinella' introduced him to a wide audience"]},"maneski ia.","In 2011 he received the Prince of Asturias Award for Letters."],"links":[]},"celine-dion":{"origin":"Charlemagne, Québec","years":"1981 – present","bio":"One of the most powerful and best-selling voices ever, equally at home in French and English.","songs":[["Ne partez pas sans moi","1988"],["The Power of Love","1993"],["Pour que tu m'aimes encore","1995"],["My Heart Will Go On","1997"]],"facts":["She's the youngest of 14 children.","She won Eurovision 1988 singing for Switzerland.","In 2024 she sang 'Hymne à l'amour' from the Eiffel Tower for the Paris Olympics."],"links":["She paid tribute to Piaf at the Paris 2024 Olympics"]},"the-weeknd":{"origin":"Toronto","years":"2010 – present","bio":"Abel Tesfaye took R&B into dark, cinematic territory, all the way to the 1980s synth-pop of 'Blinding Lights'.","songs":[["Can't Feel My Face","2015"],["Starboy","2016"],["Blinding Lights","2019"],["Save Your Tears","2020"]],"facts":["'Blinding Lights' tops Billboard's chart of the greatest songs of all time.","His parents emigrated from Ethiopia.","In 2021 he headlined the Super Bowl halftime show."],"links":["His family's Ethiopian roots"]},"vicente-fernandez":{"origin":"Guadalajara","years":"1940 – 2021","bio":"'Chente', the king of ranchera: dressed as a charro, he took traditional Mexican song into stadiums.","songs":[["Volver, volver","1972"],["El Rey","1973"],["Hermoso cariño","1976"],["Acá entre nos","1983"]],"facts":["'El Rey' is a José Alfredo Jiménez classic that he made immortal.","In 2016 he said farewell to the stage at Estadio Azteca.","He acted in more than thirty films."],"links":[]},"natalia-lafourcade":{"origin":"Mexico City","years":"2002 – present","bio":"A singer-songwriter who has rediscovered Latin America's musical heritage with modern elegance, winner of numerous Latin Grammys.","songs":[["En el 2000","2002"],["Hasta la raíz","2015"],["Tú sí sabes quererme","2017"],["Nunca es suficiente","2018"]],"facts":["Her 'Musas' album series pays tribute to e also served as Minister of Culture.","songs":[["Aquele Abraço","1969"],["Expresso 2222","1972"],["Refazenda","1975"],["Andar com Fé","1982"]],"facts":["He was Brazil's Minister of Culture from 2003 to 2008.","He lived in exile in London from 1969 to 1972.","He's a member of the Brazilian Academy of Letters."],"links":[]},"anitta":{"origin":"Rio de Janeiro","years":"2010 – present","bio":"From funk carioca to global Latin pop, Anitta is the most international Brazilian pop star of her generation.","songs":[["Show das Poderosas","2013"],["Downtown","2017"],["Vai Malandra","2017"],["Envolver","2021"]],"facts":["Her real name is Larissa de Macedo Machado.","In 2022 'Envolver' became the first solo song by a Brazilian artist to hit No. 1 on Spotify's global chart.","She started out singing in the church choir."],"links":[]},"piazzolla":{"origin":"Mar del Plata","years":"1921 – 1992","bio":"With his bandoneón he revolutionised tango, blending it with jazz and classical music in 'tango nuevo'.","songs":[["Adiós Nonino","1959"],["Verano Porteño","1965"],["Libertango","1974"],["Oblivion","1982"]],"facts":["He grew up in New York, where he got his first bandoneón.","Composer Nadia Boulanger pushed him to stick with tango.","'Libertango' was recorded in Milan."],"links":[]},"mercedes-sosa":{"origin":"San Miguel de Tucumán","years":"1935 – 2009","bio":"'La Negra', the voice of Argentine folk music and Nueva Canción, a symbol of freedom across Latin America.","songs":[["Alfonsina y el mar","1969"],["Gracias a la vida","1971"],["Solo le pido a Dios","1982"],["Todo cambia","1984"]],"facts":["'Gracias a la vida' was written by Chilean artist Violeta Parra.","She lived in exile in Europe between 1979 and 1982.","She was a UNICEF Goodwill Ambassador."],"links":["She made Violeta Parra's 'Gracias a la vida' famous"]},"violeta-parra":{"origin":"San Carlos","years":"1917 – 1967","bio":"Researcher of Chilean folklore, singer-songwriter and visual artist: the mother of Chilean Nueva Canción.","songs":[["Run Run se fue pa'l norte","1966"],["Volver a los diecisiete","1966"],["Gracias a la vida","1966"],["La jardinera","1962"]],"facts":["In 1964 she became the first Latin American artist with a solo exhibition at the Louvre's Musée des Arts Décoratifs.","She collected thousands of folk songs while traveling across Chile.","She was also an embroiderer and a painter."],"links":["Her 'Gracias a la vida' became famous through Mercedes Sosa"]},"fela-kuti":{"origin":"Abeokuta","years":"1938 – 1997","bio":"The inventor of Afrobeat: long tracks blending highlife, jazz and funk, with lyrics openly criticizing those in power.","songs":[["Lady","1972"],["Water No Get Enemy","1975"],["Zombie","1976"],["Shakara","1972"]],"facts":["In Lagos he founded a commune he called the 'Kalakuta Republic'.","In 2009 the musical 'Fela!' opened on Broadway.","Many of his tracks run for more than ten minutes."],"links":["Burna Boy's grandfather was Fela's manager"]},"burna-boy":{"origin":"Port Harcourt","years":"2010 – present","bio":"The 'African Giant' mixes Afrobeats, dancehall and hip-hop, and is one of the faces of new African music worldwide.","songs":[["Ye","2018"],["On the Low","2018"],["Last Last","2022"],["City Boys","2023"]],"facts":["His grandfather, Benson Idonije, was one of Fela Kuti's first managers.","In 2021 he won the Grammy for Best Global Music Album.","He was the first African artist to fill a US stadium as a solo act."],"links":["A family legacy"]},"ali-farka-toure":{"origin":"Kanau","years":"1939 – 2006","bio":"The 'African John Lee Hooker': a guitarist who revealed the ties between the music of the Sahel and American blues.","songs":[["Diaraby","1994"],["Ai Du","1994"],["Savane","2006"],["Bonde","1994"]],"facts":["With Ry Cooder he won a Grammy for the album 'Talking Timbuktu' (1994).","In 2004 he was elected mayor of Niafunké.","He farmed his fields between tours."],"links":["Ry Cooder, a producer in common"]},"salif-keita":{"origin":"Djoliba","years": .","songs":[["Yèkèrmo Sèw","1969"],["Tezeta","1972"],["Yègellé Tezeta","1974"],["Netsanet","1974"]],"facts":["He was the first African to study at Berklee College of Music in Boston.","Jim Jarmusch used his music in the film 'Broken Flowers' (2005).","He plays vibraphone, percussion and keyboards."],"links":["Ethiopian roots"]},"miriam-makeba":{"origin":"Johannesburg","years":"1932 – 2008","bio":"'Mama Africa': the first great African star on the world stage and a voice against apartheid.","songs":[["The Click Song (Qongqothwane)","1963"],["Malaika","1965"],["Pata Pata","1967"],["Soweto Blues","1977"]],"facts":["She lived in exile for over thirty years.","In 1966 she became the first African artist to win a Grammy, with Harry Belafonte.","She spoke against apartheid before the United Nations."],"links":[]},"umm-kulthum":{"origin":"Tamay ez-Zahayra","years":"1904 – 1975","bio":"'The Star of the East', the most revered voice in the Arab world: her concerts brought entire countries to a standstill.","songs":[["Inta el Hob","1965"],["Enta Omri","1964"],["Al Atlal","1966"],["Alf Leila wa Leila","1969"]],"facts":["Her monthly radio concerts lasted for hours, with songs running over an hour.","Millions of people attended her funeral in Cairo.","As a child she sang dressed as a boy so she could perform."],"links":[]},"khaled":{"origin":"Oran","years":"1974 – present","bio":"The 'King of Raï' brought the music of Oran to Europe and the world with sunny, irresistible melodies.","songs":[["Didi","1992"],["Aïcha","1996"],["Abdel Kader","1998"],["C'est la vie","2012"]],"facts":["'Aïcha' was written for him by Jean-Jacques Goldman.","'Abdel Kader' was sung with Rachid Taha and Faudel at the '1, 2, 3 Soleils' concert.","'Didi' was also a hit in India and the Middle East."],"links":[]},"ravi-shankar":{"origin":"Varanasi","years":"1920 – 2012","bio":"The sitar master who brought Indian classical music to the West, in dialogue with jazz, rock and European classical music.","songs":[[ is Is Mongol","2022"]],"facts":["They play the morin khuur, the horsehead fiddle.","The name 'Hu' comes from a Mongolian word for human being.","They became famous thanks to two YouTube videos in 2018."],"links":[]},"acdc":{"origin":"Sydney","years":"1973 – present","bio":"Stripped-down, powerful riffs: the Young brothers defined hard rock for decades.","songs":[["Highway to Hell","1979"],["Back in Black","1980"],["You Shook Me All Night Long","1980"],["Thunderstruck","1990"]],"facts":["'Back in Black' is one of the best-selling albums of all time.","Angus Young plays in a schoolboy uniform.","The name comes from a label on a sewing machine."],"links":[]},"kylie":{"origin":"Melbourne","years":"1987 – present","bio":"From the soap 'Neighbours' to the dance floor: Kylie is one of the longest-lasting and best-loved pop stars.","songs":[["The Loco-Motion","1987"],["Spinning Around","2000"],["Can't Get You Out of My Head","2001"],["Padam Padam","2023"]],"facts":["She started out as an actress on the soap 'Neighbours'.","She won a Grammy in 2024 for 'Padam Padam'.","She has had UK No. 1 hits in five different decades."],"links":[]},"sia":{"origin":"Adelaide","years":"1997 – present","bio":"Hitmaker for many stars and a singer with an unmistakable voice, known for hiding her face.","songs":[["Titanium (with David Guetta)","2011"],["Chandelier","2014"],["Elastic Heart","2015"],["Cheap Thrills","2016"]],"facts":["She often performs in a wig that covers her face.","She has written songs for Rihanna, Beyoncé and other stars.","Maddie Ziegler danced in the 'Chandelier' videos."],"links":[]},"lorde":{"origin":"Auckland","years":"2013 – present","bio":"Ella Yelich-O'Connor wrote 'Royals' at 16, changing the sound of pop with an unexpected minimalism.","songs":[["Royals","2013"],["Team","2013"],["Green Light","2017"],["Solar Power","2021"]],"facts":["'Royals' won the Grammy for Song of the Year in 2014.","She wrote 'Royals' at 16.","She curated the soundtrack for 'The Hunger Games: Mockingjay – Part 1'."],"links":[]},"chopin":{"origin":"Żelazowa Wola","years":"1810 – 1849","bio":"The poet of the piano: nocturnes, waltzes, polonaises and ballades that defined musical Romanticism.","songs":[["Ballade No. 1, Op. 23","1835"],["Nocturne Op. 9 No. 2","1832"],["Polonaise 'Heroic' Op. 53","1842"],["Waltz 'Minute' Op. 64 No. 1","1847"]],"facts":["His heart is kept in the Holy Cross Church in Warsaw, while he is buried in Paris.","Since 1927 Warsaw has hosted the International Chopin Piano Competition.","Warsaw's airport is named after him."],"links":["Friends and rivals in the salons of Paris"]},"dvorak":{"origin":"Nelahozeves","years":"1841 – 1904","bio":"A Bohemian composer who combined the symphonic tradition with the folk songs of his homeland and, later, of America.","songs":[["Slavonic Dances, Op. 46","1878"],["Symphony No. 9 'From the New World'","1893"],["Humoresque Op. 101 No. 7","1894"],["Song to the Moon (Rusalka)","1901"]],"facts":["He wrote the Ninth Symphony while directing the conservatory in New York.","Neil Armstrong took a recording of the Ninth to the Moon.","He was a huge fan of steam locomotives."],"links":[]},"liszt":{"origin":"Raiding","years":"1811 – 1886","bio":"The most acclaimed pianist of the 19th century and an innovative composer: he invented the modern solo recital.","songs":[["Hungarian Rhapsody No. 2","1847"],["Liebestraum No. 3","1850"],["Consolation No. 3","1850"],["La campanella","1851"]],"facts":["Heinrich Heine coined the term 'Lisztomania' for his fans' frenzy.","He is considered the inventor of the solo piano recital.","Budapest's airport is named after him."],"links":["Friends and rivals in the salons of Paris"]},"o-zone":{"origin":"Chișinău","years":"1998 – 2005","bio":"A Moldovan trio that became famous all over Europe with a summer hit sung in Romanian.","songs":[["Despre tine","2002"],["Dragostea din tei","2003"],["De ce plâng chitarele","2004"]],"facts":["An American fan's 'Numa Numa' video (2004) was one of the web's first viral hits.","Rihanna and T.I. sampled the song in 'Live Your Life' (2008).","The song was written by Dan Bălan, now a solo artist."],"links":[]},"bregovic":{"origin":"Sarajevo","years":"1974 – present","bio":"Founder of Yugoslavia's biggest rock band and composer of Kusturica's film scores, he takes Balkan brass bands around the world.","songs":[["Ederlezi","1988"],["In the Death Car (with Iggy Pop)","1993"],["Kalashnikov","1995"],["Mesečina","1995"]],"facts":["He founded Bijelo Dugme, the most famous band of the former Yugoslavia.","He scored 'Time of the Gypsies', 'Arizona Dream' and 'Underground'.","He tours with his Wedding and Funeral Orchestra."],"links":[]},"2cellos":{"origin":"Pula / Zagreb","years":"2011 – 2023","bio":"Luka Šulić and Stjepan Hauser, classically trained cellists, took the web by storm playing rock and pop.","songs":[["Smooth Criminal","2011"],["With or Without You","2011"],["Thunderstruck","2013"],["Game of Thrones","2017"]],"facts":["Their 'Smooth Criminal' video went viral within days.","They toured with Elton John.","They appeared on the TV series 'Glee'."],"links":["Their 'Thunderstruck' is an AC/DC cover"]},"aqua":{"origin":"Copenhagen","years":"1989 – present","bio":"A Danish-Norwegian '90s bubblegum pop group, tongue-in-cheek and super colorful.","songs":[["Roses Are Red","1996"],["Barbie Girl","1997"],["Doctor Jones","1997"],["Turn Back Time","1998"]],"facts":["Mattel sued over 'Barbie Girl' but lost: the judge told the parties to 'chill'.","Singer Lene Nystrøm is Norwegian.","In 2023 the song was reworked as 'Barbie World' for the film 'Barbie'."],"links":[]},"yello":{"origin":"Zurich","years":"1979 – present","bio":"Dieter Meier and Boris Blank: witty, cinematic electronic music and sampling pioneers.","songs":[["Bostich","1981"],["Oh Yeah","1985"],["Vicious Games","1985"],["The Race","1988"]],"facts":["'Oh Yeah' became famous through the film 'Ferris Bueller's Day Off' (1986).","Boris Blank builds his sounds from thousands of recorded samples.","Dieter Meier is also a conceptual artist and entrepreneur."],"links":[]},"voix-bulgares":{"origin":"Sofia","years":"1952 – present","bio":"The Bulgarian radio and television women's choir, with hypnotic, dissonant harmonies, a worldwide revelation in the 1980s.","songs":[["Pilentze Pee","1975"],["Kalimankou Denkou","1975"],["Polegnala e Todora","1975"],["Erghen Diado","1975"]],"facts":["In 1990 they won a Grammy for traditional music.","The choir began as the state radio ensemble, founded by Philip Koutev.","Their voices inspired artists like Kate Bush."],"links":[]},"arvo-part":{"origin":"Paide","years":"1958 – present","bio":"Composer of silence and essentials: his 'tintinnabuli' style brought contemporary music close to everyone.","songs":[["Für Alina","1976"],["Fratres","1977"],["Tabula rasa","1977"],["Spiegel im Spiegel","1978"]],"facts":["For many years he was the most performed living composer in the world.","In 1980 he left the Soviet Union for Vienna and then Berlin.","Estonia has opened a center devoted to his work, the Arvo Pärt Centre."],"links":[]},"ofra-haza":{"origin":"Tel Aviv","years":"1957 – 2000","bio":"The 'Madonna of the East' blended Yemenite songs with electronic pop, winning over clubs around the world.","songs":[["Hi","1983"],["Im Nin'alu","1984"],["Galbi","1984"],["Deliver Us","1998"]],"facts":["In 1983 she came second at Eurovision.","'Im Nin'alu' was sampled in the remix of Eric B. & Rakim's 'Paid in Full'.","For 'The Prince of Egypt' she sang 'Deliver Us' in several languages."],"links":[]},"fairuz":{"origin":"Beirut","years":"1950 – present","bio":"The voice of Lebanon: with the Rahbani brothers she created a repertoire that accompanies mornings across the Arab world.","songs":[["Zahrat al-Mada'en","1967"],["Nassam Alayna El Hawa","1970s"],["Li Beirut","1984"],["Kifak Inta","1991"]],"facts":["'Li Beirut' is built on Joaquín Rodrigo's Concierto de Aranjuez.","In many Arab countries her songs are the soundtrack of the morning.","She worked for decades with her husband Assi Rahbani and her son Ziad."],"links":[]},"shajarian":{"origin":"Mashhad","years":"1940 – 2020","bio":"The great master of Persian classical singing, revered for the purity of his voice and the depth of his interpretation.","songs":[["Rabbana","1970s"],["Bidad","1985"],["Morgh-e Sahar","1980s"],["Jan-e Oshagh","1990s"]],"facts":["For decades his 'Rabbana' was broadcast on Iranian radio before the breaking of the fast during Ramadan.","He received UNESCO's Mozart Medal in 2006.","He designed new string instruments together with a luthier."],"links":[]},"khachaturian":{"origin":"Tbilisi","years":"1903 – 1978","bio":"An Armenian composer of sweeping melodies who brought together the symphony orchestra and the rhythms of the Caucasus.","songs":[["Violin Concerto","1940"],["Waltz from 'Masquerade'","1941"],["Sabre Dance (Gayane)","1942"],["Adagio from 'Spartacus'","1956"]],"facts":["The 'Sabre Dance' was written in a few hours, shortly before the ballet's premiere.","The Adagio from 'Spartacus' has been used in many films and TV series.","He was born in Georgia to an Armenian family."],"links":["Two greats of the Armenian diaspora"]},"dimash":{"origin":"Aktobe","years":"2015 – present","bio":"A singer with an extraordinary vocal range, at home in opera, pop and traditional Kazakh singing.","songs":[["SOS d'un terrien en détresse","2017"],["Daididau","2017"],["Love of Tired Swans","2019"],["Stranger","2019"]],"facts":["He became famous in 2017 on the Chinese talent show 'I Am a Singer'.","In 2015 he won the Grand Prix at the Slavianski Bazaar in Vitebsk.","His fans are called 'Dears'."],"links":[]},"anggun":{"origin":"Jakarta","years":"1986 – present","bio":"A teenage rock star in Indonesia and then a pop star in France, with a warm, versatile voice.","songs":[["Mimpi","1989"],["Snow on the Sahara","1997"],["La neige au Sahara","1997"],["Echo (You and I)","2012"]],"facts":["In 2012 she represented Fran const gBase = root.append("g"), gC = root.append("g"), gM = root.append("g");
const features = topojson.feature(WORLD, WORLD.objects.countries).features.filter(f => f.id !== "010");
const featById = Object.fromEntries(features.map(f => [f.id, f]));
const projection = d3.geoNaturalEarth1();
const path = d3.geoPath(projection);
let W = 0, H = 0, K = 1;

function largest(f){
  if (f.geometry.type !== "MultiPolygon") return f;
  let best = null, ba = -1;
  for (const coords of f.geometry.coordinates){
    const p = { type:"Feature", geometry:{ type:"Polygon", coordinates: coords } };
    const a = d3.geoArea(p); if (a > ba){ ba = a; best = p; }
  }
  return best;
}
const mainPart = {}; Object.keys(COUNTRIES).forEach(id => { if (featById[id]) mainPart[id] = largest(featById[id]); });

const sphere = gBase.append("path").datum({type:"Sphere"}).attr("class","sphere");
const grat = gBase.append("path").datum(d3.geoGraticule10()).attr("class","grat");
const countries = gC.selectAll("path").data(features).join("path")
  .attr("class", d => "c" + (COUNTRIES[d.id] ? " has" : ""))
  .attr("data-id", d => d.id);
const markers = gM.selectAll("g").data(Object.keys(COUNTRIES).filter(id => mainPart[id])).join("g").attr("class","mk");
markers.append("circle").attr("class","pulse").attr("r",7.5);
markers.append("circle").attr("class","dot").attr("r",7.5);
markers.append("text").text(id => byCountry[id].length);

function topInset(){ return $("#top").getBoundingClientRect().height; }
function sheetH(){ return isDesk() ? 0 : $("#sheet").getBoundingClientRect().height; }

function layout(){
  const r = $("#stage").getBoundingClientRect(); W = r.width; H = r.height;
  const t = topInset();
  const mobileBottom = isDesk() ? 16 : Math.round(H * 0.34);
  projection.fitExtent([[isDesk() ? 24 : 12, t + 4], [W - (isDesk() ? 76 : 12), H - mobileBottom]], {type:"Sphere"});
  sphere.attr("d", path); grat.attr("d", path); countries.attr("d", path);
  markers.each(function(id){ const c = projection(d3.geoCentroid(mainPart[id])); this.__xy = c; });
  zoom.extent([[0,0],[W,H]]).translateExtent([[-W*0.3,-H*0.3],[W*1.3,H*1.3]]);
  placeMarkers();
}
function placeMarkers(){
  const s = (K < 2 ? 1 : 0.9) / K;
  markers.attr("transform", function(){ const p=this.__xy||[0,0]; return `translate(${p[0]},${p[1]}) scale(${s})`; });
}
const zoom = d3.zoom().scaleExtent([1, 14]).clickDistance(8)
  .on("zoom", e => { root.attr("transform", e.transform); K = e.transform.k; placeMarkers(); });
svg.call(zoom).on("dblclick.zoom", null);

function paintMap(){
  countries.classed("sel", d => d.id === S.country)
    .classed("off", d => COUNTRIES[d.id] && !byCountry[d.id].some(matchGenre));
  markers.classed("sel", id => id === S.country)
    .classed("off", id => !byCountry[id].some(matchGenre));
}

function visibleBox(){
  const t = topInset() + 8, b = isDesk() ? 16 : sheetH() + 12;
  return { x: 16, y: t, w: W - 32, h: Math.max(80, H - t - b) };
}
function flyTo(id, extra = 1){
  const f = mainPart[id] || featById[id]; if (!f) return;
  const [[x0,y0],[x1,y1]] = path.bounds(f);
  const v = visibleBox();
  let k = 0.55 / Math.max((x1-x0)/v.w, (y1-y0)/v.h);
  k = Math.max(1.6, Math.min(k * extra, 9));
  const cx = (x0+x1)/2, cy = (y0+y1)/2;
  const tr = d3.zoomIdentity.translate(v.x + v.w/2 - k*cx, v.y + v.h/2 - k*cy).scale(k);
  svg.transition().duration(reduced ? 0 : 950).ease(d3.easeCubicInOut).call(zoom.transform, tr);
}
function flyToRegion(lon, lat, k){
  const p = projection([lon, lat]); const v = visibleBox();
  svg.transition().duration(reduced ? 0 : 900).call(zoom.transform, d3.zoomIdentity.translate(v.x+v.w/2-k*p[0], v.y+v.h/2-k*p[1]).scale(k));
}
function resetView(){
  svg.transition().duration(reduced ? 0 : 700).call(zoom.transform, d3.zoomIdentity);
}

function onCountryClick(id){
  if (COUNTRIES[id]) { haptic("tap"); go(`paese-${COUNTRIES[id].slug}`); }
  else { const f = featById[id]; toast(t("noArtists", f && f.properties.name ? f.properties.name : t("thisCountry"))); }
}
countries.on("click", (e,d) => onCountryClick(d.id));
markers.on("click", (e,id) => { e.stopPropagation(); onCountryClick(id); });

/* tooltip (solo mouse) */

if (matchMedia("(hover: hover)").matches){

/* ——— Foglio trascinabile */
const sheet = $("#sheet");
const SIZES = { peek: () => 150, half: () => Math.round(innerHeight*0.48), full: () => Math.round(innerHeight - topInset() + 40) };
let size = "half";
function setSize(s){
  size = s;
  if (isDesk()) { sheet.style.removeProperty("--sheet-h"); return; }
  sheet.style.setProperty("--sheet-h", Math.min(SIZES[s](), innerHeight - 20) + "px");
}
(function drag(){
  const grab = $("#grab"); let y0, h0, moved;
  grab.addEventListener("pointerdown", e => { if (isDesk()) return; y0 = e.clientY; h0 = sheet.getBoundingClientRect().height; moved = false; sheet.classList.add("dragging"); grab.setPointerCapture(e.pointerId); });
  grab.addEventListener("pointermove", e => { if (y0 == null) return; const dy = y0 - e.clientY; if (Math.abs(dy) > 4) moved = true; sheet.style.setProperty("--sheet-h", Math.max(110, Math.min(innerHeight - 20, h0 + dy)) + "px"); });
  const end = () => {
    if (y0 == null) return; sheet.classList.remove("dragging");
    const h = sheet.getBoundingClientRect().height; y0 = null;
    if (!moved){ setSize(size === "full" ? "half" : size === "half" ? "full" : "half"); return; }
    const best = Object.keys(SIZES).sort((a,b) => Math.abs(SIZES[a]()-h) - Math.abs(SIZES[b]()-h))[0];
    setSize(best);
  };
  grab.addEventListener("pointerup", end); grab.addEventListener("pointercancel", end);
  grab.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); setSize(size === "full" ? "half" : "full"); } });
})();

/* ——— Router (hash) */
function go(h){ if (location.hash.slice(1) === h) route(); else location.hash = h; }
function goBack(fallback){ if (history.length > 1 && sessionHasNav) history.back(); else go(fallback); }
let sessionHasNav = false;
addEventListener("hashchange", () => { sessionHasNav = true; route(); });

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  S.artist = null; S.country = null;
  if (h.startsWith("artista-") && artistById[h.slice(8)]){
    const a = artistById[h.slice(8)]; S.artist = a.id; S.country = a.c; S.tab = "mappa";
    setSize("full"); flyTo(a.c, 1);
  } else if (h.startsWith("paese-") && slugToId[h.slice(6)]){
    S.country = slugToId[h.slice(6)]; S.tab = "mappa";
    setSize("half"); requestAnimationFrame(() => flyTo(S.country));
  } else if (h === "esplora"){ S.tab = "esplora"; setSize("full"); }
  else if (h === "preferiti"){ S.tab = "preferiti"; setSize("full"); }
  else if (h === "quiz"){ S.tab = "quiz"; setSize("half"); if (Q && Q.answered != null) S.country = Q.list[Q.i].a.c; }
  else { S.tab = "mappa"; }
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", String(t.dataset.tab === S.tab)));
  paintMap(); render();
  $("#body").scrollTop = 0;
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  const k = t.dataset.tab;
  if (k === "mappa"){ history.replaceState(null, "", location.pathname + location.search); route(); setSize("half"); resetView(); }
  else go(k);
}));

/* ——— Viste */
function render(){
  const b = $("#body");
  let html;
  if (S.tab === "quiz") html = viewQuiz();
  else if (S.artist) html = viewArtist(artistById[S.artist]);
  else if (S.country) html = viewCountry(S.country);
  else if (S.tab === "esplora") html = viewExplore();
  else if (S.tab === "preferiti") html = viewFavs();
  else html = viewHome();
  b.innerHTML = `<div class="fade-in">${html}</div>`;
}

/* ——— Quiz */
let Q = null;
let best = 0; try { best = +localStorage.getItem("mg-best") || 0; } catch(e) {}
const QN = 10;
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const pickN = (arr, n) => shuffle(arr).slice(0, n);
const maskName = (txt, a) => {
  let t = txt;
  const parts = [a.name, a.name.replace(/\(.*?\)/g,"").trim(), ...a.name.replace(/\(.*?\)/g,"").split(/\s+/).filter(w => w.length > 3)];
  parts.forEach(p => { if (p) t = t.split(p).join("…"); });
  return t;
};
function makeQuestion(kind, a){
  if (kind === "song"){
    const [title, year] = a.songs[Math.floor(Math.random()*a.songs.length)];
    const region = COUNTRIES[a.c].region;
    const others = Object.keys(COUNTRIES).filter(id => id !== a.c);
    const near = pickN(others.filter(id => COUNTRIES[id].region === region), 2);
    const far = pickN(others.filter(id => !near.includes(id)), 3 - near.length);
    const opts = shuffle([a.c, ...near, ...far]).map(id => ({ key: id, label: COUNTRIES[id].name }));
    return { kind, a, answer: a.c, opts, title: t("qSong"), clue: `<b>“${esc(title)}”</b> <span class="count">· ${esc(year)}</span>` };
  }
  if (kind === "fact"){
    const fact = maskName(a.facts[Math.floor(Math.random()*a.facts.length)], a);
    const pool = ARTISTS.filter(x => x.id !== a.id && x.c !== a.c);
    const same = pickN(pool.filter(x => x.genre === a.genre), 2);
    const rest = pickN(pool.filter(x => !same.includes(x)), 3 - same.length);
    const opts = shuffle([a, ...same, ...rest]).map(x => ({ key: x.id, label: x.name }));
    return { kind, a, answer: a.id, opts, title: t("qFact"), clue: esc(fact) };
  }
  // artist -> country
  const others = Object.keys(COUNTRIES).filter(id => id !== a.c);
  const opts = shuffle([a.c, ...pickN(others, 3)]).map(id => ({ key: id, label: COUNTRIES[id].name }));
  return { kind, a, answer: a.c, opts, title: t("qArtist"), clue: `<b>${esc(a.name)}</b> <span class="count">· ${esc(GENRES[a.genre])}</span>` };
}
function startQuiz(mode){
  const pool = ARTISTS.filter(matchGenre).length >= 12 ? ARTISTS.filter(matchGenre) : ARTISTS;
  const picks = pickN(pool, QN);
  const kinds = mode === "mix" ? ["song","fact","artist"] : [mode];
  Q = { mode, i: 0, score: 0, answered: null, missed: [], list: picks.map((a, n) => makeQuestion(kinds[n % kinds.length], a)) };
  S.country = null; paintMap(); resetView(); render(); $("#body").scrollTop = 0;
}
function answerQuiz(key){
  if (!Q || Q.answered != null) return;
  const q = Q.list[Q.i]; Q.answered = key;
  if (key === q.answer) { Q.score++; haptic("ok"); } else { Q.missed.push(q.a.id); haptic("ko"); }
  S.country = q.a.c; paintMap(); flyTo(q.a.c, 0.8);
  render();
  const v = document.querySelector(".verdict + .btn-row");
  if (v) v.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "end" });
}
function nextQuiz(){
  if (!Q) return;
  if (Q.i < QN - 1){ Q.i++; Q.answered = null; S.country = null; paintMap(); render(); $("#body").scrollTop = 0; return; }
  if (Q.score > best){ best = Q.score; try { localStorage.setItem("mg-best", String(best)); } catch(e) {} Q.record = true; }
  Q.done = true; S.country = null; paintMap(); resetView(); render(); $("#body").scrollTop = 0;
}
function viewQuiz(){
  const QI = {
    song:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
    fact:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>',
    artist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11z"/></svg>',
    mix:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>'
  };
  if (!Q || Q.done && Q.showMenu){
    return `<div class="stack">
      <div><div class="eyebrow">${t("quizEyebrow")}</div><h1 class="h1">${t("quizTitle")}</h1>
      <p class="lead">${t("quizLead")} ${best ? t("record", best) : ""}</p></div>
      <div class="modes">
        <button class="mode" data-quiz="mix"><span class="ic">${QI.mix}</span><span class="txt"><div class="t">${t("mMix")}</div><div class="s">${t("mMixS")}</div></span>${ICON.chev}</button>
        <button class="mode" data-quiz="song"><span class="ic">${QI.song}</span><span class="txt"><div class="t">${t("mSong")}</div><div class="s">${t("mSongS")}</div></span>${ICON.chev}</button>
        <button class="mode" data-quiz="fact"><span class="ic">${QI.fact}</span><span class="txt"><div class="t">${t("mFact")}</div><div class="s">${t("mFactS")}</div></span>${ICON.chev}</button>
        <button class="mode" data-quiz="artist"><span class="ic">${QI.artist}</span><span class="txt"><div class="t">${t("mArtist")}</div><div class="s">${t("mArtistS")}</div></span>${ICON.chev}</button>
      </div>
      ${S.genre !== "all" ? `<p class="count">${esc(t("quizFiltered", GENRES[S.genre]))}</p>` : ""}
    </div>`;
  }
  if (Q.done){
    const pct = Q.score / QN;
    const msg = pct === 1 ? t("r100") : pct >= .7 ? t("r70") : pct >= .4 ? t("r40") : t("r0");
    const missed = [...new Set(Q.missed)].map(id => artistById[id]);
    return `<div class="stack">
      <div class="final"><div class="eyebrow">${t("result")}</div><div class="big">${Q.score}<span>/${QN}</span></div>
        <p class="lead" style="margin-inline:auto">${msg}${Q.record ? ` <b>${t("newRecord")}</b>` : ""}</p></div>
      <div class="btn-row"><button class="cta" data-quiz="${Q.mode}">${t("again")}</button><button class="ghost" data-quizmenu>${t("change")}</button></div>
      ${missed.length ? `<div class="sec"><h2 class="h2">${t("toDiscover")}</h2><div class="card-list">${missed.map(a => artistRow(a, COUNTRIES[a.c].name + " · " + GENRES[a.genre])).join("")}</div></div>` : ""}
    </div>`;
  }
  const q = Q.list[Q.i]; const done = Q.answered != null; const right = Q.answered === q.answer;
  return `<div class="stack" style="gap:16px">
    <div class="sec" style="gap:8px">
      <div class="qhead"><span class="eyebrow">${t("question", Q.i + 1, QN)}</span><span class="qscore">${t("points")} <b>${Q.score}</b></span></div>
      <div class="qbar" role="progressbar" aria-valuemin="0" aria-valuemax="${QN}" aria-valuenow="${Q.i + (done?1:0)}"><i style="width:${(Q.i + (done?1:0)) / QN * 100}%"></i></div>
    </div>
    <div class="prompt"><div class="q">${q.title}</div><div class="clue">${q.clue}</div></div>
    <div class="opts">${q.opts.map(o => {
      const cls = done ? (o.key === q.answer ? "ok" : o.key === Q.answered ? "ko" : "dim") : "";
      return `<button class="opt ${cls}" data-ans="${esc(o.key)}" ${done ? "disabled" : ""}>${esc(o.label)}</button>`; }).join("")}</div>
    ${done ? `<div class="verdict fade-in">${vinyl(q.a, 52, true)}<div class="txt"><div class="t">${right ? t("right") : t("wrong")} ${esc(q.a.name)}</div><div class="s">${esc(COUNTRIES[q.a.c].name)} · ${esc(GENRES[q.a.genre])} · ${esc(q.a.years)}</div></div></div>
      <div class="btn-row"><button class="ghost" data-artist="${q.a.id}">${t("openCard")}</button><button class="cta" data-next>${Q.i < QN - 1 ? t("next") : t("seeResult")}</button></div>` : ""}
  </div>`;
}

/* ——— Click delegati nel pannello */
$("#body").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.quiz) { if (S.tab !== "quiz") go("quiz"); startQuiz(t.dataset.quiz); return; }
  if (t.dataset.ans != null && t.hasAttribute("data-ans")) { answerQuiz(t.dataset.ans); return; }
  if (t.hasAttribute("data-next")) { nextQuiz(); return; }
  if (t.hasAttribute("data-quizmenu")) { Q = null; render(); return; }
  if (t.dataset.share) { shareArtist(artistById[t.dataset.share]); return; }
  if (t.dataset.artist) go(`artista-${t.dataset.artist}`);
  else if (t.dataset.country) go(`paese-${t.dataset.country}`);
  else if (t.hasAttribute("data-home")) { history.replaceState(null,"",location.pathname+location.search); route(); setSize("half"); resetView(); }
  else if (t.dataset.region) { const [lon,lat,k] = t.dataset.region.split(",").map(Number); setSize("peek"); setTimeout(() => flyToRegion(lon,lat,k), 60); }
  else if (t.hasAttribute("data-surprise")) $("#surprise").click();
  else if (t.hasAttribute("data-clear")) { S.genre = "all"; renderChips(); paintMap(); render(); }
  else if (t.dataset.fav) {
    const id = t.dataset.fav;
    favs = isFav(id) ? favs.filter(x => x !== id) : [...favs, id]; saveFavs(); haptic("tap");
    t.setAttribute("aria-pressed", String(isFav(id)));
    t.setAttribute("aria-label", isFav(id) ? L[LANG].favRemove : L[LANG].favAdd);
    toast(isFav(id) ? L[LANG].favAdded(artistById[id].name) : L[LANG].favRemoved);
  }
});

/* ——— Ricerca */
let SEARCH_INDEX = [];
function buildIndex(){
SEARCH_INDEX = [];
Object.entries(COUNTRIES).forEach(([id,c]) => SEARCH_INDEX.push({ k:"Paesi", key: norm(c.name), label:c.name, sub:`${t("nArtists", byCountry[id].length)} · ${regName(c.region)}`, href:`paese-${c.slug}`, a: byCountry[id][0] }));
ARTISTS.forEach(a => {
  SEARCH_INDEX.push({ k:"Artisti", key: norm(a.name), label:a.name, sub:`${COUNTRIES[a.c].name} · ${GENRES[a.genre]}`, href:`artista-${a.id}`, a });
  a.songs.forEach(([t,y]) => SEARCH_INDEX.push({ k:"Canzoni", key: norm(t), label:t, sub:`${a.name} · ${y}`, href:`artista-${a.id}`, a }));
});
}
buildIndex();
function hl(label, q){
  const i = norm(label).indexOf(q); if (i < 0 || !q) return esc(label);
  return esc(label.slice(0,i)) + "<mark>" + esc(label.slice(i, i+q.length)) + "</mark>" + esc(label.slice(i+q.length));
}
function renderResults(){
  const q = norm($("#q").value.trim());
  const box = $("#results");
  if (!q){
    const sug = t("sug");
    box.innerHTML = `<div class="sec"><h2 class="h2">${t("tryThis")}</h2><div class="chips" style="flex-wrap:wrap;margin:0;padding:0">${sug.map(s=>`<button class="chip" data-sug="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`;
    return;
  }
  const hits = SEARCH_INDEX.filter(x => x.key.includes(q) || (x.k==="Paesi" && norm(COUNTRIES[slugToId[x.href.slice(6)]]?.blurb||"").includes(q)) || (x.k==="Artisti" && norm(GENRES[x.a.genre]).includes(q)));
  const GL = { Artisti: t("gArtists"), Canzoni: t("gSongs"), Paesi: t("gCountries") };
  const groups = ["Artisti","Canzoni","Paesi"].map(k => [k, hits.filter(h => h.k === k).slice(0, 8)]).filter(([,l]) => l.length);
  box.innerHTML = groups.length ? groups.map(([k,l]) => `<div class="sec"><div class="sec-head"><h2 class="h2">${GL[k]}</h2><span class="count">${l.length}</span></div><div class="card-list">${l.map(h => `<button class="row" data-go="${h.href}">${vinyl(h.a,40)}<div class="txt"><div class="t">${hl(h.label,q)}</div><div class="s">${esc(h.sub)}</div></div>${ICON.chev}</button>`).join("")}</div></div>`).join("")
    : `<div class="empty"><b>${esc(t("noResults", $("#q").value))}</b>${t("noResultsS")}</div>`;
}
function openSearch(){ $("#search").hidden = false; $("#q").value = ""; renderResults(); setTimeout(() => $("#q").focus(), 30); }
function closeSearch(){ $("#search").hidden = true; }
$("#searchBtn").onclick = openSearch;
$("#qclose").onclick = closeSearch;
$("#q").addEventListener("input", renderResults);
$("#results").addEventListener("click", e => {
  const s = e.target.closest("[data-sug]"); if (s){ $("#q").value = s.dataset.sug; renderResults(); return; }
  const r = e.target.closest("[data-go]"); if (r){ closeSearch(); go(r.dataset.go); }
});
addEventListener("keydown", e => {
  if (e.key === "Escape"){ if (!$("#search").hidden) closeSearch(); else if (S.artist) go(`paese-${COUNTRIES[S.country].slug}`); else if (S.country){ history.replaceState(null,"",location.pathname+location.search); route(); resetView(); } }
  if (e.key === "/" && $("#search").hidden && document.activeElement.tagName !== "INPUT"){ e.preventDefault(); openSearch(); }
});

/* ——— Avvio */
applyStatic();
$("#langBtn").addEventListener("click", () => {
  LANG = LANG === "it" ? "en" : "it";
  try { localStorage.setItem("mg-lang", LANG); } catch(e) {}
  applyContent(); applyStatic(); buildIndex(); renderChips(); Q = null; render();
  if (!$("#search").hidden) renderResults();
  toast(t("langToast"));
});
renderChips();
setSize("half");
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { layout(); setSize(size); }, 120); });
requestAnimationFrame(() => {
  layout();
  if (!location.hash && !isDesk()) flyToRegion(15, 30, 1.7);
  route();
});
})();
}
</script>

fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json").then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){WORLD=j;__mgStart()}).catch(function(){var p=document.createElement("p");p.style.cssText="position:fixed;inset:auto 16px 50% 16px;text-align:center;font:15px system-ui";p.textContent="Mappa non disponibile. Ricarica la pagina. / Map unavailable, please reload.";document.body.appendChild(p)});
</script>
